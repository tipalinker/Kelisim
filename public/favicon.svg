<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121b22" />
      <stop offset="100%" stop-color="#090e13" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Glow -->
  <path d="M50 8 L85 24 V52 C85 74 50 92 50 92 C50 92 15 74 15 52 V24 Z" fill="none" stroke="#2dd4bf" stroke-width="4" opacity="0.3" filter="url(#glow)"/>

  <!-- Shield Base -->
  <path d="M50 10 L82 25 V50 C82 70 50 88 50 88 C50 88 18 70 18 50 V25 Z" fill="url(#shieldBg)" stroke="url(#shieldBorder)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Futuristic K letter -->
  <!-- Vertical stem -->
  <path d="M33 28 H43 V72 H33 Z" fill="url(#shieldBorder)" />
  
  <!-- Diagonal upper branch -->
  <path d="M41 48 L65 28 H75 L49 53 Z" fill="url(#shieldBorder)" />
  
  <!-- Diagonal lower branch -->
  <path d="M46 51 L74 72 H63 L39 55 Z" fill="url(#shieldBorder)" />

  <!-- Blockchain node network -->
  <circle cx="21" cy="48" r="3" fill="#34d399" />
  <circle cx="68" cy="40" r="3" fill="#2dd4bf" />
  <circle cx="73" cy="52" r="3" fill="#06b6d4" />
  <line x1="68" y1="40" x2="73" y2="52" stroke="#2dd4bf" stroke-width="1.5" />
</svg>
